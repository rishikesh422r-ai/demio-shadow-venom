<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEMIO AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080b14;
    color: #f4f6ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    height: 70px;
    padding: 15px 22px;
    border-bottom: 1px solid #222b40;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #66d9ff;
}

.status {
    font-size: 12px;
    color: #8df5bb;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.welcome {
    text-align: center;
    padding: 50px 10px 30px;
}

.core {
    width: 95px;
    height: 95px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #76e6ff, #1265a0, #11172d);
    box-shadow: 0 0 35px #168dff88;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
        box-shadow: 0 0 55px #168dffcc;
    }
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.welcome p {
    color: #929db5;
    font-size: 14px;
}

#messages {
    min-height: 250px;
    padding-bottom: 130px;
}

.message {
    padding: 15px 17px;
    margin: 14px 0;
    border-radius: 15px;
    max-width: 85%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #153a5d;
    margin-left: auto;
    border: 1px solid #28608d;
}

.bot {
    background: #151c2d;
    border: 1px solid #27364e;
    margin-right: auto;
}

.bot strong {
    color: #67d9ff;
}

.message img {
    display: block;
    max-width: 100%;
    max-height: 250px;
    margin-top: 10px;
    border-radius: 10px;
}

.message a {
    color: #7adfff;
}

.typing {
    color: #75dfff;
    font-size: 13px;
    margin: 10px;
}

.composer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 15px;
    background: #080b14;
    border-top: 1px solid #253047;
}

.input-area {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    background: #141b2b;
    border: 1px solid #33425d;
    padding: 10px;
    border-radius: 17px;
}

textarea {
    flex: 1;
    resize: none;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    font-size: 15px;
    min-height: 35px;
    max-height: 120px;
    padding: 8px;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 10px;
    padding: 12px;
    color: white;
    background: #176fa8;
    font-size: 14px;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

button:hover:not(:disabled) {
    background: #238ccf;
}

.send {
    background: #087fc5;
    font-weight: bold;
}

#preview {
    max-width: 850px;
    margin: 0 auto 8px;
    color: #9bdfff;
    font-size: 12px;
}

.tools {
    max-width: 850px;
    margin: 10px auto 0;
    display: flex;
    gap: 10px;
}

.tools button {
    background: transparent;
    border: 1px solid #33425d;
    color: #a9c9df;
}

.error {
    color: #ff8585;
}

@media(max-width: 600px) {
    main {
        padding: 12px;
    }

    .message {
        max-width: 95%;
    }

    .welcome {
        padding-top: 35px;
    }

    .input-area {
        gap: 5px;
        padding: 7px;
    }

    button {
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">DEMIO</div>
    <div class="status" id="status">● CONNECTING</div>
</header>

<main>

    <section class="welcome" id="welcome">
        <div class="core"></div>
        <h1>Welcome to DEMIO</h1>
        <p>Your personal AI intelligence system.</p>
    </section>

    <section id="messages"></section>

</main>

<div class="composer">

    <div id="preview"></div>

    <div class="input-area">

        <button onclick="document.getElementById('file').click()"
                title="Attach image or video">＋</button>

        <input type="file"
               id="file"
               accept="image/*,video/*"
               hidden>

        <textarea
            id="txt"
            placeholder="Message DEMIO..."
            rows="1"></textarea>

        <button onclick="listen()" title="Voice input">🎤</button>

        <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>

    </div>

    <div class="tools">
        <button onclick="clearChat()">New Chat</button>
        <button onclick="checkServer()">Check Connection</button>
    </div>

</div>

<script>

const API_URL = "/api/chat";

let history = [];
let selectedImages = [];
let selectedVideo = null;
let busy = false;

const $ = id => document.getElementById(id);

function setStatus(text, good = true) {
    $("status").textContent = (good ? "● " : "● ") + text;
    $("status").style.color = good ? "#8df5bb" : "#ff8585";
}

function addMessage(role, text, images = []) {

    $("welcome").style.display = "none";

    const div = document.createElement("div");

    div.className = "message " + (role === "user" ? "user" : "bot");

    const label = document.createElement("strong");

    label.textContent = role === "user" ? "YOU\n" : "DEMIO\n";

    div.appendChild(label);

    const content = document.createElement("div");
    content.textContent = text;

    div.appendChild(content);

    images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Uploaded image";
        div.appendChild(img);
    });

    $("messages").appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return div;
}

function showError(message) {
    const div = addMessage("assistant", "Error: " + message);
    div.classList.add("error");
}

async function checkServer() {
    try {
        const response = await fetch("/health");
        const data = await response.json();

        if (!response.ok) throw new Error("Server unavailable");

        if (!data.ai_configured) {
            setStatus("API KEY MISSING", false);
            return;
        }

        setStatus("AI SYSTEM ONLINE");

    } catch (error) {
        setStatus("SERVER OFFLINE", false);
    }
}

$("file").addEventListener("change", async function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (file.size > 20 * 1024 * 1024) {
        alert("Please select a file smaller than 20 MB.");
        event.target.value = "";
        return;
    }

    if (file.type.startsWith("image/")) {

        if (selectedImages.length >= 4) {
            alert("Maximum four images per message.");
            return;
        }

        const reader = new FileReader();

        reader.onload = () => {
            selectedImages.push(reader.result);
            $("preview").textContent =
                selectedImages.length + " image(s) attached.";
        };

        reader.readAsDataURL(file);

    } else if (file.type.startsWith("video/")) {

        selectedVideo = file;

        $("preview").textContent =
            "Video selected: " + file.name +
            " (upload storage only; video analysis is not enabled).";

    } else {
        alert("Unsupported file.");
    }

    event.target.value = "";

});

async function sendMessage() {

    if (busy) return;

    const message = $("txt").value.trim();

    if (!message && selectedImages.length === 0 && !selectedVideo) {
        return;
    }

    const images = [...selectedImages];
    const video = selectedVideo;

    const displayText = message ||
        (images.length ? "Please look at these images." : "Video attachment");

    addMessage("user", displayText, images);

    $("txt").value = "";
    selectedImages = [];
    selectedVideo = null;
    $("preview").textContent = "";

    busy = true;
    $("sendBtn").disabled = true;
    setStatus("PROCESSING");

    const typing = addMessage("assistant", "DEMIO is thinking...");

    try {

        let finalMessage = message;

        // Store uploaded video
        if (video) {

            const formData = new FormData();
            formData.append("file", video);

            const uploadResponse = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const uploadData = await uploadResponse.json();

            if (!uploadResponse.ok) {
                throw new Error(uploadData.error || "Video upload failed.");
            }

            finalMessage +=
                "\nVideo uploaded successfully: " +
                uploadData.url +
                "\nNote: The video is stored but its contents are not analyzed.";
        }

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: finalMessage,
                history: history,
                images: images
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI request failed.");
        }

        if (!data.reply) {
            throw new Error("DEMIO returned an empty response.");
        }

        typing.remove();

        addMessage("assistant", data.reply);

        history.push({
            role: "user",
            content: finalMessage
        });

        history.push({
            role: "assistant",
            content: data.reply
        });

        if ("speechSynthesis" in window) {
            // Voice output is optional.
        }

        setStatus("AI SYSTEM ONLINE");

    } catch (error) {

        typing.remove();

        showError(error.message);

        setStatus("RESPONSE FAILED", false);

    } finally {

        busy = false;
        $("sendBtn").disabled = false;

    }

}

function clearChat() {

    history = [];
    selectedImages = [];
    selectedVideo = null;

    $("messages").innerHTML = "";
    $("txt").value = "";
    $("preview").textContent = "";

    $("welcome").style.display = "block";

    setStatus("AI SYSTEM ONLINE");

}

function listen() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice recognition is not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.interimResults = false;

    recognition.onresult = event => {
        $("txt").value =
            event.results[0][0].transcript;
    };

    recognition.onerror = () => {
        alert("Voice recognition failed.");
    };

    recognition.start();

}

$("txt").addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }

});

checkServer();

</script>

</body>
</html>
