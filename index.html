<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON 2099 | DEMIO AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070d;color:#f4f5ff;font-family:Arial,sans-serif;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:235px;background:#090d18;border-right:1px solid #492039;padding:24px 15px}
.logo{font-size:23px;font-weight:900;letter-spacing:4px;color:#ff315e}
.sub{font-size:10px;color:#9296aa;letter-spacing:3px;margin-top:8px}
.nav{margin-top:45px}
.nav button{width:100%;padding:15px;margin:7px 0;text-align:left;background:#111626;color:#ddd;border:1px solid #292d42;border-radius:9px;cursor:pointer}
.nav button:hover{border-color:#ff315e;color:#ff6482}
.status{margin-top:40px;font-size:11px;color:#9296aa}
.dot{display:inline-block;width:8px;height:8px;background:#26edaa;border-radius:50%;margin-right:7px;box-shadow:0 0 12px #26edaa}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:65px;border-bottom:1px solid #302033;padding:23px 27px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px}
.online{color:#ff4268}
.workspace{flex:1;overflow-y:auto;padding:25px;display:flex;flex-direction:column;align-items:center}
.core{width:112px;height:112px;border:1px solid #ff315e;border-radius:50%;display:grid;place-items:center;margin:8px auto 18px;box-shadow:0 0 25px #ff164c, inset 0 0 20px #ff164c44;animation:pulse 2.5s infinite}
.core span{width:43px;height:8px;background:#ff315e;box-shadow:0 0 18px #ff315e;border-radius:5px}
@keyframes pulse{50%{box-shadow:0 0 50px #ff164c,inset 0 0 30px #ff164c77;transform:scale(1.05)}}
.heading{text-align:center;font-size:23px;letter-spacing:4px;font-weight:bold}
.tagline{text-align:center;font-size:10px;letter-spacing:3px;color:#a1a5b9;margin-top:10px}
.chat{width:100%;max-width:900px;margin:35px auto 20px;display:flex;flex-direction:column;gap:17px}
.msg{padding:15px 18px;border:1px solid #42304d;border-radius:13px;background:#151b2c;line-height:1.55;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.ai{align-self:flex-start;border-left:3px solid #ff315e}
.user{align-self:flex-end;border-right:3px solid #ff315e;background:#21182a}
.composer{width:100%;max-width:950px;margin:auto auto 12px;padding:12px;background:#111627;border:1px solid #a73561;border-radius:17px;display:flex;gap:9px;align-items:center}
.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:15px;padding:12px}
.btn{background:#282039;border:1px solid #74304d;color:#ff6687;border-radius:10px;padding:12px;cursor:pointer;font-size:17px}
.send{background:#ff315e;color:white;border:0;font-weight:bold}
.btn:hover{filter:brightness(1.3)}
#file{display:none}
.hint{font-size:10px;color:#8e91a4;text-align:center;margin:0 0 8px}
#preview{color:#ff8aa3;font-size:11px;max-width:950px;margin:0 auto 5px}
@media(max-width:650px){
.sidebar{width:65px;padding:15px 7px}
.logo{font-size:12px;letter-spacing:0}
.sub,.nav button span,.status{display:none}
.nav{margin-top:35px}
.nav button{font-size:17px;text-align:center;padding:12px 3px}
.top{padding:20px 12px;font-size:10px}
.workspace{padding:15px}
.heading{font-size:18px}
.composer{gap:5px;padding:7px}
.btn{padding:10px}
.msg{max-width:95%;font-size:13px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">ULTRON</div>
  <div class="sub">2099 AI CORE</div>
  <div class="nav">
    <button onclick="newChat()">◈ <span>New conversation</span></button>
    <button onclick="document.getElementById('file').click()">＋ <span>Upload files</span></button>
    <button onclick="startVoice()">🎙 <span>Voice mode</span></button>
    <button onclick="setLanguage('Tamil')">அ <span>Tamil mode</span></button>
    <button onclick="setLanguage('English')">A <span>English mode</span></button>
  </div>
  <div class="status"><span class="dot"></span> SYSTEM READY<br><br>SUPERVISOR MODE</div>
</aside>

<main class="main">
  <header class="top">
    <span>SUPERVISOR MODE</span>
    <span class="online">● AI INTERFACE</span>
  </header>

  <section class="workspace" id="workspace">
    <div class="core"><span></span></div>
    <div class="heading">HOW CAN I HELP YOU?</div>
    <div class="tagline">ONE INTELLIGENCE. MANY CAPABILITIES.</div>
    <div class="chat" id="chat">
      <div class="msg ai">ULTRON online. வணக்கம்! How can I help you?</div>
    </div>
  </section>

  <div id="preview"></div>
  <div class="composer">
    <button class="btn" onclick="document.getElementById('file').click()" title="Attach file">＋</button>
    <input id="message" placeholder="Message ULTRON..." autocomplete="off">
    <input type="file" id="file" accept="image/*,.txt,.md,.csv,.pdf,.docx" onchange="showFile(this)">
    <button class="btn" onclick="startVoice()" title="Speak">🎙</button>
    <button class="btn send" onclick="sendMessage()">➤</button>
  </div>
  <div class="hint">Attach images & documents · Tamil & English · Enter to send</div>
</main>
</div>

<script>
let selectedFile=null;
let language="English";
const chat=document.getElementById("chat");
const input=document.getElementById("message");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  chat.appendChild(div);
  document.getElementById("workspace").scrollTop=
    document.getElementById("workspace").scrollHeight;
  return div;
}
function newChat(){
  chat.innerHTML="";
  selectedFile=null;
  document.getElementById("file").value="";
  document.getElementById("preview").textContent="";
  addMessage("New conversation started. வணக்கம்!","ai");
}
function setLanguage(lang){
  language=lang;
  addMessage("Language changed to "+lang+".","ai");
}
function showFile(el){
  selectedFile=el.files[0]||null;
  document.getElementById("preview").textContent=
    selectedFile?"Attached: "+selectedFile.name:"";
}
async function sendMessage(){
  const message=input.value.trim();
  if(!message&&!selectedFile)return;
  addMessage(message+(selectedFile?"\n📎 "+selectedFile.name:""),"user");
  input.value="";
  const file=selectedFile;
  selectedFile=null;
  document.getElementById("file").value="";
  document.getElementById("preview").textContent="";
  const loading=addMessage("ULTRON is processing your request...","ai");
  const data=new FormData();
  data.append("message",message);
  data.append("language",language);
  if(file)data.append("file",file);
  try{
    const response=await fetch("/api/chat",{method:"POST",body:data});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||"Server error "+response.status);
    loading.textContent=result.reply;
    if(result.audio_text && "speechSynthesis" in window){
      speak(result.reply);
    }
  }catch(error){
    loading.textContent="Connection error: "+error.message+
      "\nCheck your app.py, API key and server logs.";
  }
}
function startVoice(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    addMessage("Voice recognition is not supported in this browser. Try Chrome.","ai");
    return;
  }
  const recognition=new SpeechRecognition();
  recognition.lang=language==="Tamil"?"ta-IN":"en-IN";
  recognition.interimResults=false;
  recognition.onresult=(event)=>{
    input.value=event.results[0][0].transcript;
    sendMessage();
  };
  recognition.onerror=()=>addMessage("Voice recognition failed. Please try again.","ai");
  recognition.start();
}
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=language==="Tamil"?"ta-IN":"en-IN";
  speechSynthesis.speak(utterance);
}
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
</script>
</body>
</html>
