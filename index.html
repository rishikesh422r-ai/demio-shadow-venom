<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON AI SYSTEM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#030307;
 color:#ff253d;
 font-family:Arial,sans-serif;
 overflow:hidden;
}

#hud{
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:5;
 padding:25px;
}

.top{
 display:flex;
 justify-content:space-between;
 border-bottom:1px solid #a80020;
 padding-bottom:18px;
 letter-spacing:4px;
 text-shadow:0 0 12px red;
 font-weight:bold;
}

.logo{font-size:25px;color:#ff1835}

.center-title{
 position:absolute;
 top:15%;
 left:50%;
 transform:translateX(-50%);
 text-align:center;
 width:100%;
 letter-spacing:4px;
}

.center-title h2{
 font-size:22px;
 text-shadow:0 0 15px red;
}

.center-title p{
 margin-top:9px;
 font-size:10px;
 letter-spacing:5px;
}

#scene{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
}

.bottom{
 position:absolute;
 bottom:25px;
 left:25px;
 right:25px;
 display:flex;
 gap:12px;
}

.panel{
 flex:1;
 border:1px solid #8c1025;
 background:rgba(35,0,8,.65);
 padding:13px;
 font-size:10px;
 letter-spacing:2px;
}

.panel strong{
 display:block;
 margin-top:8px;
 font-size:15px;
 color:#ff253d;
}

.status{
 position:absolute;
 bottom:115px;
 width:100%;
 text-align:center;
 font-size:12px;
 letter-spacing:3px;
 text-shadow:0 0 12px red;
}

@media(max-width:600px){
 #hud{padding:15px}
 .logo{font-size:18px}
 .center-title{top:17%}
 .center-title h2{font-size:15px}
 .bottom{left:12px;right:12px;gap:5px;bottom:15px}
 .panel{padding:8px;font-size:8px}
 .panel strong{font-size:11px}
 .status{bottom:90px;font-size:9px}
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div id="hud">

 <div class="top">
  <div class="logo">ULTRON.</div>
  <div>AI CORE // 2099</div>
 </div>

 <div class="center-title">
  <h2>ARTIFICIAL INTELLIGENCE</h2>
  <p>ADVANCED NEURAL SYSTEM</p>
 </div>

 <div class="status">
  <div>ADVANCED ANDROID INTELLIGENCE</div>
  <br>
  <div id="status">● SYSTEM INITIALIZING</div>
 </div>

 <div class="bottom">
  <div class="panel">NEURAL CORE<strong>ACTIVE</strong></div>
  <div class="panel">AI ENGINE<strong>ONLINE</strong></div>
  <div class="panel">SECURITY<strong>ONLINE</strong></div>
 </div>

</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030307);

const camera = new THREE.PerspectiveCamera(
 38, window.innerWidth/window.innerHeight, .1, 100
);
camera.position.set(0,0,10);

const renderer = new THREE.WebGLRenderer({
 canvas:document.getElementById('scene'),
 antialias:true,
 alpha:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;

scene.add(new THREE.AmbientLight(0x555566,2));

const redLight=new THREE.PointLight(0xff001c,45,15);
redLight.position.set(0,1,5);
scene.add(redLight);

const blueLight=new THREE.PointLight(0x162bff,12,15);
blueLight.position.set(-4,1,3);
scene.add(blueLight);

const robot=new THREE.Group();
scene.add(robot);

const metal=new THREE.MeshStandardMaterial({
 color:0x555b66,
 metalness:.95,
 roughness:.25
});

const darkMetal=new THREE.MeshStandardMaterial({
 color:0x10131b,
 metalness:.95,
 roughness:.2
});

const silver=new THREE.MeshStandardMaterial({
 color:0x9ca4b0,
 metalness:1,
 roughness:.2
});

const red=new THREE.MeshStandardMaterial({
 color:0xff001e,
 emissive:0xff001e,
 emissiveIntensity:4,
 metalness:.4
});

const black=new THREE.MeshStandardMaterial({
 color:0x030307,
 metalness:.8,
 roughness:.2
});

function sphere(parent,material,pos,scale){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(1,32,24),
  material
 );
 m.position.set(...pos);
 m.scale.set(...scale);
 parent.add(m);
 return m;
}

function box(parent,material,pos,scale){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(...scale),
  material
 );
 m.position.set(...pos);
 parent.add(m);
 return m;
}

// Main robotic head
sphere(robot,metal,[0,0,0],[1.65,2.05,.85]);

// Forehead armour
sphere(robot,silver,[0,1.35,.48],[1.25,.62,.42]);

// Central forehead plate
sphere(robot,darkMetal,[0,1.45,.82],[.5,.38,.16]);

// Jaw
sphere(robot,darkMetal,[0,-1.05,.35],[1.25,.85,.65]);

// Chin armour
sphere(robot,silver,[0,-1.62,.55],[.72,.28,.32]);

// Cheeks
for(const side of [-1,1]){
 sphere(robot,silver,[side*1.05,-.35,.5],[.48,.85,.3]);
 sphere(robot,darkMetal,[side*.8,-.95,.7],[.45,.42,.25]);

 // Side temple armour
 sphere(robot,metal,[side*1.45,.55,0],[.28,.75,.65]);

 // Side mechanical details
 for(let i=0;i<3;i++){
  box(robot,silver,[side*1.53,.25-i*.18,.48],[.12,.07,.15]);
 }
}

// Eyes
const eyes=[];

for(const side of [-1,1]){
 const eye=sphere(
  robot,red,[side*.67,.55,.83],[.39,.19,.15]
 );
 eyes.push(eye);

 // Eye dark socket
 sphere(robot,black,[side*.67,.55,.72],[.48,.27,.12]);

 // Glowing eye placed in front
 sphere(robot,red,[side*.67,.55,.91],[.3,.12,.12]);

 // Brow armour
 const brow=sphere(
  robot,silver,[side*.68,.88,.76],[.57,.16,.23]
 );
 brow.rotation.z=side*.12;

 // Under-eye armour
 sphere(robot,darkMetal,[side*.7,.22,.77],[.5,.12,.16]);
}

// Nose bridge
sphere(robot,silver,[0,.15,.8],[.18,.65,.23]);
sphere(robot,darkMetal,[0,-.28,.92],[.27,.25,.2]);

// Mouth mechanical grille
box(robot,black,[0,-1.1,.88],[.85,.27,.13]);

for(let i=-3;i<=3;i++){
 box(robot,silver,[i*.115,-1.1,.99],[.035,.2,.035]);
}

// Facial side vents
for(const side of [-1,1]){
 for(let i=0;i<4;i++){
  box(robot,darkMetal,[side*.98,-1.1+i*.12,.83],[.18,.045,.08]);
 }
}

// Head crown
sphere(robot,metal,[0,1.8,.05],[.65,.27,.5]);

// Neck
sphere(robot,darkMetal,[0,-2.05,0],[.65,.35,.5]);

// Neck rings
for(let i=0;i<3;i++){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.55+i*.05,.045,8,48),
  silver
 );
 ring.position.set(0,-2.1-i*.12,0);
 robot.add(ring);
}

// Scan light
const scanMaterial=new THREE.MeshBasicMaterial({
 color:0xff001e,
 transparent:true,
 opacity:.45,
 side:THREE.DoubleSide
});

const scan=new THREE.Mesh(
 new THREE.PlaneGeometry(3.2,.025),
 scanMaterial
);
scan.position.set(0,0,1.12);
robot.add(scan);

// Floating HUD rings
const rings=[];

for(let i=0;i<3;i++){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(2.25+i*.2,.009,8,120),
  new THREE.MeshBasicMaterial({
   color:0xff001e,
   transparent:true,
   opacity:.4
  })
 );
 ring.position.z=-.8-i*.1;
 ring.scale.y=.85;
 robot.add(ring);
 rings.push(ring);
}

// Background particles
const particleCount=700;
const positions=new Float32Array(particleCount*3);

for(let i=0;i<particleCount;i++){
 positions[i*3]=(Math.random()-.5)*12;
 positions[i*3+1]=(Math.random()-.5)*9;
 positions[i*3+2]=-2-Math.random()*5;
}

const particleGeometry=new THREE.BufferGeometry();
particleGeometry.setAttribute(
 'position',
 new THREE.BufferAttribute(positions,3)
);

const particles=new THREE.Points(
 particleGeometry,
 new THREE.PointsMaterial({
  color:0xff1938,
  size:.025,
  transparent:true,
  opacity:.7
 })
);

scene.add(particles);

// Mouse tracking
let mouseX=0,mouseY=0;

window.addEventListener('mousemove',e=>{
 mouseX=(e.clientX/window.innerWidth-.5)*2;
 mouseY=(e.clientY/window.innerHeight-.5)*2;
});

window.addEventListener('touchmove',e=>{
 if(e.touches.length){
  mouseX=(e.touches[0].clientX/window.innerWidth-.5)*2;
  mouseY=(e.touches[0].clientY/window.innerHeight-.5)*2;
 }
},{passive:true});

// Animation
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const t=clock.getElapsedTime();

 // Actual 3D head movement
 robot.rotation.y+=
  (mouseX*.35-robot.rotation.y)*.045;

 robot.rotation.x+=
  (-mouseY*.18-robot.rotation.x)*.045;

 robot.position.y=Math.sin(t*.8)*.06;

 // Eye pulsing
 eyes.forEach((eye,i)=>{
  eye.material.emissiveIntensity=
   2.5+Math.sin(t*4)*1.5;
 });

 // Scanning animation
 scan.position.y=Math.sin(t*1.3)*1.55;

 // HUD ring rotation
 rings.forEach((ring,i)=>{
  ring.rotation.z=t*(i%2===0?.12:-.12);
 });

 // Red light pulse
 redLight.intensity=38+Math.sin(t*3)*10;

 particles.rotation.y=t*.015;

 renderer.render(scene,camera);
}

animate();

document.getElementById('status').textContent=
'● NEURAL SYSTEM ONLINE';

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>

</body>
</html>
